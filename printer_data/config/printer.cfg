[include moongate.cfg]
[include mainsail.cfg]
[include KAMP_Settings.cfg]
## *** THINGS TO CHANGE/CHECK: ***
## Motor currents                                                               [extruder] [stepper] and [_HOME_X/Y] macro sections
## Fine tune E steps                                                            [extruder] section
## For more info                                                                check https://docs.vorondesign.com/build/startup/#v0

[mcu]
serial: /dev/ttyS0
restart_method: command

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[exclude_object]

[display_status]

[gcode_arcs]
resolution: 1.0

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 6.0

############################
#   X/Y Stepper Settings   #
############################

[stepper_x] #B-drive (Left Motor)
step_pin: gpio11
dir_pin: gpio10                                                     
enable_pin: !gpio12
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 40
homing_retract_dist: 17
use_sensorless_homing: true
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
interpolate: False
run_current: 0.75        
# you need to calculate the run_current value using the equation (rated_motor_current * 0.707 = Maximum_run_current) start with a value that is about 60%-70% of your maximum value.
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle
diag_pin: ^gpio4    												# YOU NEED TO JUMP THIS DIAG PIN ON YOUR BOARD FOR SENSORLESS HOMING TO WORK 
driver_SGTHRS: 95								# this is set to 255 which is the MAX sensitivity for sensorless homing, you will need to tune this later

#[autotune_tmc stepper_x]
#motor: moons-ms14hs5p4150
#tuning_goal: silent
#sgt: -64

[stepper_y] #A-drive (Right Motor)
step_pin: gpio6
dir_pin: gpio5                                                      # Check motor direction in link above. If inverted, add a ! before gpio5
enable_pin: !gpio7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
interpolate: False
run_current: 0.75           
# you need to calculate the run_current value using the equation (rated_motor_current * 0.707 = Maximum_run_current) start with a value that is about 60%-70% of your maximum value.
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle
diag_pin: ^gpio3    												# YOU NEED TO JUMP THIS DIAG PIN ON YOUR BOARD FOR SENSORLESS HOMING TO WORK 
driver_SGTHRS: 95	# this is set to 255 which is the MAX sensitivity for sensorless homing, you will need to tune this later

#[autotune_tmc stepper_y]
#motor: moons-ms14hs5p4150
#tuning_goal: silent
#sgt: -64

##########################
#   Z Stepper Settings   #
##########################

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28                                                    # Remove the ! before gpio28 if motor direction is inverted.
enable_pin: !gpio2
rotation_distance: 8                                                
microsteps: 32
endstop_pin: probe:z_virtual_endstop #^gpio25
#position_endstop: 120
position_max: 120
position_min: -20
homing_speed: 20
second_homing_speed: 3.0
homing_retract_dist: 3.0
homing_positive_dir: false  


[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
interpolate: False
run_current: 0.38
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle

#[autotune_tmc stepper_z]
#motor: moons-le174s-t0808-200-ar3-s-065
#tuning_goal: auto

################
#   Extruder   #
################

[extruder]
step_pin: gpio14
dir_pin: gpio13                                                     # Add ! if moving opposite direction
enable_pin: !gpio15
full_steps_per_rotation: 200                                      
rotation_distance: 22.8969                                         # See calibrating rotation_distance on extruders doc
gear_ratio: 5:1                                                   
microsteps: 32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: Generic 3950
sensor_pin: gpio27
control: pid                                                       
pid_Kp: 28.508
pid_Ki: 9.503 
pid_Kd: 21.381
min_temp: 0
max_temp: 280
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 0.8
pressure_advance: 0.0                                               # See tuning pressure advance doc
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
interpolate: False
run_current: 0.55
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 0 for spreadcycle, avoid using stealthchop on extruder

##################
#   Bed Heater   #
##################

[heater_bed]
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio26
smooth_time: 3.0
min_temp: 0
max_temp: 110
control: pid                                                        
pid_kp: 26.451
pid_ki: 0.675 
pid_kd: 258.997

###################
#   Fan Control   #
###################

[heater_fan hotend_fan]
pin: gpio18
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
#fan_speed: 1.0                                                     # You can't PWM the delta fan unless using blue wire

[fan]
pin: gpio17
max_power: 1.0
kick_start_time: 0.5                                                # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.13
cycle_time: 0.010

[controller_fan MCU_fan]
pin: gpio20
max_power: 1.0
kick_start_time: 0.5
heater: extruder
#fan_speed: 1.0 

##############################
#   Filament Runout Sensor   #
##############################

[filament_switch_sensor Filament_Runout_Sensor]
pause_on_runout: True
runout_gcode: PAUSE
switch_pin: gpio16

##############
#   Probe    #
############## gpio25 gpio29

[homing_override]
axes: xyz
set_position_z: 0
gcode:
   G90
   G0 Z5 F600
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}
  
  {% if home_all or 'Z' in params %}
  	QUERY_PROBE
    SS_CONDITIONAL_TAKE_PROBE
    G1 X40 Y60
    _HOME_Z
    G91
    G1 Z1
    G90
    QUERY_PROBE
    SS_CONDITIONAL_STOW_PROBE
  {% endif %}

[probe]
pin: gpio25
x_offset: 20
y_offset: 0
#z_offset: 0
speed: 20.0
samples: 2
sample_retract_dist: 5.0
lift_speed: 30.0
samples_tolerance: 0.01
samples_tolerance_retries: 15
deactivate_on_each_sample: 0
drop_first_result: True

[bed_mesh]
speed: 200
horizontal_move_z: 25
mesh_min: 20,20
mesh_max: 100, 100
probe_count: 5,5
algorithm: bicubic

[servo probeServo]
pin: gpio29
minimum_pulse_width: 0.000544

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY
gcode:
	HOME_CHECK
	QUERY_PROBE
    SS_CONDITIONAL_TAKE_PROBE
    G1 X80 Y60
	_PROBE_ACCURACY
    QUERY_PROBE
    SS_CONDITIONAL_STOW_PROBE

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
	HOME_CHECK
	QUERY_PROBE
    SS_CONDITIONAL_TAKE_PROBE
	G1 X40 Y60
    _PROBE_CALIBRATE
    QUERY_PROBE
#    TESTZ Z=20
	SS_DEPLOY
    M117 Remove the Probe to continue!
    
[gcode_macro SS_OFFSETS]
variable_x: 20
variable_y: 0
gcode:
  M118 Offsets X:{printer["gcode_macro SS_OFFSETS"].x} Y:{printer["gcode_macro SS_OFFSETS"].y}
  
[gcode_macro SS_PICKUP_POS]
variable_x: 115
variable_y: 50
variable_z: 30
gcode:
  M118 pickup pos X:{printer["gcode_macro SS_PICKUP_POS"].x} Y:{printer["gcode_macro SS_PICKUP_POS"].y} Z:{printer["gcode_macro SS_PICKUP_POS"].z}

[gcode_macro SS_DEPLOY]
gcode:
    SET_SERVO SERVO=probeServo ANGLE=160
    G4 P500 # wait for deploy
    #SET_SERVO SERVO=probeServo WIDTH=0 # OFF
    
[gcode_macro SS_RETRACT]
gcode:
    SET_SERVO SERVO=probeServo ANGLE=20
    G4 P500 # wait for retract
    SET_SERVO SERVO=probeServo WIDTH=0 # OFF

[gcode_macro SS_TAKE_PROBE]
gcode:
    G1 Z{printer["gcode_macro SS_PICKUP_POS"].z} F5000
    G1 X{printer["gcode_macro SS_PICKUP_POS"].x - 20} Y{printer["gcode_macro SS_PICKUP_POS"].y} F5000
    SS_DEPLOY
    G1 X{printer["gcode_macro SS_PICKUP_POS"].x} 
    G1 Y{printer["gcode_macro SS_PICKUP_POS"].y + 50}
    G1 X{printer["gcode_macro SS_PICKUP_POS"].x - 20}
    SS_RETRACT

[gcode_macro SS_STOW_PROBE]
gcode:
    G1 Z{printer["gcode_macro SS_PICKUP_POS"].z} F5000
    G1 X{printer["gcode_macro SS_PICKUP_POS"].x - 20} Y{printer["gcode_macro SS_PICKUP_POS"].y + 50} F5000
    SS_DEPLOY
    G1 X{printer["gcode_macro SS_PICKUP_POS"].x}
    G1 Y{printer["gcode_macro SS_PICKUP_POS"].y} F2000
    G1 X{printer["gcode_macro SS_PICKUP_POS"].x - 20} F5000
    G1 X60 Y60
    SS_RETRACT

[gcode_macro SS_CONDITIONAL_TAKE_PROBE]
gcode:
    {% set P = printer.probe.last_query %}
    {% if P %}
       SS_TAKE_PROBE
    {% endif %}

[gcode_macro SS_CONDITIONAL_STOW_PROBE]
gcode:
    {% set P = printer.probe.last_query %}
    {% if not P %}
        SS_STOW_PROBE
    {% endif %}

[gcode_macro HOME_CHECK]
gcode:
    {% if 'xyz' in printer.toolhead.homed_axes %}
        { action_respond_info("Printer already homed.") }
    {% else %}
        { action_respond_info("Printer not homed. Homing now...") }
      		G28
    {% endif %}

[gcode_macro G29]
gcode:
	HOME_CHECK
    G91
    G1 Z1
    G90
    Query_Probe
    SS_CONDITIONAL_TAKE_PROBE
    BED_MESH_CALIBRATE
    QUERY_PROBE
    SS_CONDITIONAL_STOW_PROBE

[force_move]
enable_force_move: True

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE
gcode:
    HOME_CHECK
    QUERY_PROBE
    SS_CONDITIONAL_TAKE_PROBE
    _SCREWS_TILT_CALCULATE
    QUERY_PROBE
    SS_CONDITIONAL_STOW_PROBE

[screws_tilt_adjust]
screw1: 35,5
screw1_name: front screw
screw2: 0,115
screw2_name: back left
screw3: 95,115
screw3_name: back right
speed: 50
horizontal_move_z: 20
screw_thread: CW-M3

[respond]


